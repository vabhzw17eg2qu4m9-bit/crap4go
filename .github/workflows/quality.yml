name: Quality

on: [push, pull_request]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          check-latest: true
      - name: Format check
        run: |
          # Fail if any file is not gofmt-formatted.
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - name: Test with coverage
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Build
        run: go build -o crap4go .
      - name: Self-analyze (crap4go on its own source)
        # Self-hosting: the tool computes CRAP for its own .go files and the
        # full report is visible in the run log. Informational for now (max
        # CRAP ~10, dominated by the inherent branchiness of the AST type-switch
        # in ComplexityOf and the CLI dispatcher); harden to a blocking 8.0
        # gate once those parsers are refactored. Mirrors the crap4dart CI
        # self-analysis step.
        continue-on-error: true
        run: ./crap4go
